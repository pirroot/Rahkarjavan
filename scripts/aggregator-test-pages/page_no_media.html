    <div class="article-body">
      <p>این خبر نه عکس دارد نه ویدیو و باید رد شود. انتهای پیام</p>
      <p>پاراگراف دوم با محتوای بیشتر تا حداقل طول متن پاس شود. این پاراگراف فقط برای اطمینان از طول متن است.</p>
      <p>پاراگراف سوم با محتوای بیشتر تا مجموع طول به ۲۰۰ کاراکتر برسد و سیستم آن را قبول کند.</p>
